services:

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.0
    container_name: online-shopping-aspire-dashboard
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"
    environment:
      DASHBOARD__OTLP__AUTHMODE: ApiKey
      DASHBOARD__OTLP__PRIMARYAPIKEY: ${ASPIRE_DASHBOARD_OTLP_API_KEY:?Set ASPIRE_DASHBOARD_OTLP_API_KEY before starting Compose}

  # ─────────────────────────────────────────────────────────────────────────────
  # External dependency: RabbitMQ message broker
  # Uses the official pre-built image with the management UI plugin included.
  # The management UI is available at http://localhost:15672 (guest/guest).
  # ─────────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management
    container_name: online-shopping-rabbitmq
    ports:
      - "5672:5672"     # AMQP protocol — used by CatalogService and CartService
      - "15672:15672"   # Management UI — useful for inspecting queues/exchanges
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    # healthcheck lets dependent services wait until RabbitMQ is actually ready
    # to accept connections, not just until the container process has started.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # IdentityService — issues JWT tokens used by Catalog and Cart
  # No external dependencies; JWT signing key is baked into ShoppingAuth.
  # ─────────────────────────────────────────────────────────────────────────────
  identity-service:
    build:
      context: .                            # OnlineShopping/ is the build context
      dockerfile: IdentityService/Dockerfile
    image: online-shopping/identity-service:local
    container_name: online-shopping-identity
    ports:
      - "5003:8080"   # http://localhost:5003/swagger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Telemetry__ExportEnabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=${ASPIRE_DASHBOARD_OTLP_API_KEY:?Set ASPIRE_DASHBOARD_OTLP_API_KEY before starting Compose}

  # ─────────────────────────────────────────────────────────────────────────────
  # CatalogService — manages categories and products, publishes change events
  # Depends on RabbitMQ being healthy before starting (condition: service_healthy).
  # SQLite database is stored in the named volume 'catalog-data' at /app/data.
  # ─────────────────────────────────────────────────────────────────────────────
  catalog-service:
    build:
      context: .
      dockerfile: CatalogService/Dockerfile
    image: online-shopping/catalog-service:local
    container_name: online-shopping-catalog
    ports:
      - "5002:8080"   # http://localhost:5002/swagger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Telemetry__ExportEnabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=${ASPIRE_DASHBOARD_OTLP_API_KEY:?Set ASPIRE_DASHBOARD_OTLP_API_KEY before starting Compose}
      RabbitMq__Host: rabbitmq       # overrides appsettings.json "RabbitMq:Host" — Docker DNS resolves 'rabbitmq'
      RabbitMq__Username: guest      # not in appsettings.json; credentials only come from env vars / user-secrets
      RabbitMq__Password: guest      # not in appsettings.json; credentials only come from env vars / user-secrets
      Database__Directory: /app/data # overrides "Database:Directory" — SQLite stored in the mounted volume
    volumes:
      - catalog-data:/app/data      # named volume → data survives container restarts
    depends_on:
      rabbitmq:
        condition: service_healthy  # wait until RabbitMQ passes its health check

  # ─────────────────────────────────────────────────────────────────────────────
  # CartService — manages shopping carts, consumes product-change events
  # Same pattern as CatalogService: waits for RabbitMQ, stores DB in a volume.
  # ─────────────────────────────────────────────────────────────────────────────
  cart-service:
    build:
      context: .
      dockerfile: CartService/Dockerfile
    image: online-shopping/cart-service:local
    container_name: online-shopping-cart
    ports:
      - "5001:8080"   # http://localhost:5001/swagger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Telemetry__ExportEnabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=${ASPIRE_DASHBOARD_OTLP_API_KEY:?Set ASPIRE_DASHBOARD_OTLP_API_KEY before starting Compose}
      RabbitMq__Host: rabbitmq       # overrides appsettings.json "RabbitMq:Host"
      RabbitMq__Username: guest      # not in appsettings.json; credentials only come from env vars / user-secrets
      RabbitMq__Password: guest      # not in appsettings.json; credentials only come from env vars / user-secrets
      Database__Directory: /app/data # overrides "Database:Directory" — LiteDB stored in the mounted volume
    volumes:
      - cart-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────────
  # ApiGateway — public entry point for Catalog and Cart
  # ─────────────────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    image: online-shopping/api-gateway:local
    container_name: online-shopping-api-gateway
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Telemetry__ExportEnabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=${ASPIRE_DASHBOARD_OTLP_API_KEY:?Set ASPIRE_DASHBOARD_OTLP_API_KEY before starting Compose}
      Downstream__Catalog__BaseUrl: http://catalog-service:8080
      Downstream__Cart__BaseUrl: http://cart-service:8080
    depends_on:
      - catalog-service
      - cart-service

# Named volumes — Docker manages the actual storage location.
# Data in these volumes persists across 'docker compose down' and restarts.
# Use 'docker compose down -v' to also remove them (wipes all data).
volumes:
  catalog-data:
  cart-data:
