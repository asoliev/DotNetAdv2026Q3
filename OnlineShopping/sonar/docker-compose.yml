services:
  db:
    image: postgres:18.6
    container_name: online-shopping-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker, so the volume is mounted one level up.
      - sonarqube_pg18_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    # Community Build 26.9; the image runs on Eclipse Temurin 25.
    image: sonarqube:26.9.0.129388-community
    container_name: online-shopping-sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_26_data:/opt/sonarqube/data
      - sonarqube_26_extensions:/opt/sonarqube/extensions
      - sonarqube_26_logs:/opt/sonarqube/logs

# The 9.9 / Postgres 16 volumes (sonarqube_db, sonarqube_data, sonarqube_extensions) are intentionally not
# reused: Postgres 16 data can't be opened by 18, and they are kept untouched for rollback.
volumes:
  sonarqube_pg18_db:
  sonarqube_26_data:
  sonarqube_26_extensions:
  sonarqube_26_logs:
